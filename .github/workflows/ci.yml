name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test runner
        run: python -m pip install pytest

      - name: Validate Python syntax
        run: |
          python -m py_compile BoundingBoxNavigator/*.py

      - name: Run tests
        run: python -m pytest tests -q

      - name: Validate Bash script syntax
        run: |
          bash -n launch_linux.sh
          bash -n launch_mac.command
